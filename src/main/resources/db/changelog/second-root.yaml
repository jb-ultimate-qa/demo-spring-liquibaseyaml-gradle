databaseChangeLog:
  - changeSet:
      id: 1786635122011-1
      author: Irina.Lovtsova
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_second_root_table
