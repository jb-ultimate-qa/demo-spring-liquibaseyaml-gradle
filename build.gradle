buildscript {
    dependencies {
        classpath("org.liquibase:liquibase-core:4.33.0")
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.liquibase.gradle' version '3.1.0'
}

group = 'my.example'
version = '0.0.1-SNAPSHOT'
description = 'demo-spring-liquibaseyaml-gradle'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.liquibase:liquibase-core:4.33.0'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Classpath specifically for org.liquibase.gradle
    liquibaseRuntime 'org.liquibase:liquibase-core:4.33.0'
    liquibaseRuntime 'info.picocli:picocli:4.7.7'
    liquibaseRuntime 'org.liquibase.ext:liquibase-hibernate6:4.33.0'
    liquibaseRuntime 'org.postgresql:postgresql:42.7.11'
//    liquibaseRuntime 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

liquibase {
    activities {
        main({
            arguments = [
                    defaultsFile: 'src/main/resources/liquibase.properties'
            ]
        })
    }
    runList = 'main'
}